<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tardi Bear Profile</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #007bff;
        --primary-dark: #0056b3;
        --accent: #00d2ff;
        --accent2: #a1eeff;
        --text-dark: #1e293b;
        --text-light: #64748b;
        --white: #ffffff;
        --glass: rgba(255, 255, 255, 0.95);
        --shadow: 0 10px 40px -10px rgba(0, 123, 255, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          -45deg,
          #1c8569,
          #56d7b5,
          #2b8dbc,
          #9bd7ff,
          #ffffff
        );
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text-dark);
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .logo {
        margin-bottom: 20px;
        text-align: center;
        animation: fadeIn 1s ease;
      }

      .logo img {
        height: 120px;
        width: auto;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
        animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ✅ NEW HEADER LAYOUT (Avatar on left, Info & Insurance on right) */
      .profile-header {
        background: linear-gradient(135deg, #1c8569, #2b8dbc);
        padding: 30px 25px;
        display: flex;
        align-items: center;
        gap: 20px;
        position: relative;
        color: white;
      }

      /* Dynamic Package Badge */
      .package-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .avatar-container {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--white);
        padding: 4px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        flex-shrink: 0;
      }

      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #f1f5f9;
      }

      .header-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
        overflow: hidden;
      }

      .name {
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 700;
        margin-bottom: 2px;
        line-height: 1.2;
        word-wrap: break-word;
      }

      .role-badge {
        font-size: 12px;
        font-weight: 500;
        opacity: 0.9;
        margin-bottom: 12px;
      }

      /* Insurance Box styling */
      .insurance-box {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 8px 12px;
        border-radius: 12px;
        width: 100%;
        display: none; /* Hidden until populated */
      }

      .insurance-box .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.8;
        margin-bottom: 2px;
      }

      .insurance-box .value {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Profile Content */
      .content {
        padding: 25px;
      }

      /* ✅ NEW SMART GRID FOR EXTRA INFO */
      .grid-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .grid-card {
        background: #f8fafc;
        padding: 12px 15px;
        border-radius: 16px;
        border: 1px solid rgba(0, 123, 255, 0.1);
        text-align: left;
      }

      .grid-card .label {
        font-size: 10px;
        color: var(--text-light);
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .grid-card .value {
        font-size: 13px;
        color: var(--text-dark);
        font-weight: 600;
      }

      /* Primary Info List */
      .info-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .info-item {
        display: flex;
        align-items: center;
        background: #f8fafc;
        padding: 12px 15px;
        border-radius: 16px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        border: 1px solid transparent;
      }

      .info-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        border-color: rgba(0, 123, 255, 0.2);
        background: #ffffff;
      }

      .icon-box {
        width: 38px;
        height: 38px;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 15px;
        flex-shrink: 0;
        margin-right: 15px;
        box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
      }

      .info-text {
        text-align: left;
        flex: 1;
        overflow: hidden;
      }

      .info-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-light);
        font-weight: 600;
        margin-bottom: 2px;
      }

      .info-value {
        font-size: 13px;
        color: var(--text-dark);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .download-btn {
        display: block;
        margin-top: 25px;
        background: linear-gradient(135deg, var(--accent), var(--primary));
        color: white;
        text-decoration: none;
        padding: 16px;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        text-align: center;
        box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3);
        transition: all 0.3s ease;
      }

      .download-btn:active {
        transform: scale(0.98);
      }

      /* States */
      .loading,
      .error {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
      }
      .loading i,
      .error i {
        font-size: 40px;
        margin-bottom: 15px;
      }
      .loading i {
        color: var(--primary);
        animation: spin 1s linear infinite;
      }
      .error i {
        color: #ef4444;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* Media Queries */
      @media (max-width: 380px) {
        .profile-header {
          padding: 25px 20px;
          flex-direction: column;
          text-align: center;
          gap: 15px;
        }
        .header-info {
          align-items: center;
        }
        .insurance-box {
          text-align: center;
        }
        .package-badge {
          top: 10px;
          right: 10px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <img
        src="/logo.png"
        alt="Logo"
        onerror="this.src = 'https://via.placeholder.com/150x60?text=Logo'"
      />
    </div>

    <div class="card">
      <div id="loading" class="loading">
        <i class="fas fa-circle-notch"></i>
        <p>Fetching Profile...</p>
      </div>

      <div id="error" class="error" style="display: none">
        <i class="fas fa-exclamation-circle"></i>
        <p id="errorMsg">Profile not found.</p>
      </div>

      <div id="profile" style="display: none">
        <!-- Header Section -->
        <div class="profile-header">
          <div
            id="packageBadge"
            class="package-badge"
            style="display: none"
          ></div>

          <div class="avatar-container">
            <img id="avatar" src="" class="avatar" alt="User" />
          </div>

          <div class="header-info">
            <h1 class="name" id="fullName">...</h1>
            <span class="role-badge" id="designation">...</span>

            <!-- Insurance Aside Box -->
            <div id="insuranceBox" class="insurance-box">
              <div class="label" id="insuranceProviderLabel">
                Insurance Policy
              </div>
              <div class="value" id="insuranceDetailsText">...</div>
            </div>
          </div>
        </div>

        <div class="content">
          <!-- Smart Grid for New API Details (Blood Group, DOB, etc) -->
          <div class="grid-info" id="extraGrid"></div>

          <!-- Core Info List -->
          <div class="info-list">
            <div class="info-item" id="emailRow">
              <div class="icon-box"><i class="fas fa-envelope"></i></div>
              <div class="info-text">
                <div class="info-label">Email Address</div>
                <div class="info-value" id="email">...</div>
              </div>
            </div>

            <div class="info-item" id="phoneRow">
              <div class="icon-box"><i class="fas fa-phone"></i></div>
              <div class="info-text">
                <div class="info-label">Phone Number</div>
                <div class="info-value" id="phone">...</div>
              </div>
            </div>

            <div class="info-item" id="addressRow">
              <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
              <div class="info-text">
                <div class="info-label">Location</div>
                <div class="info-value" id="address">...</div>
              </div>
            </div>
          </div>

          <a
            href="https://play.google.com/store/apps?hl=en"
            class="download-btn"
          >
            Get Tardi Bear Health App
            <i class="fas fa-arrow-right" style="margin-left: 8px"></i>
          </a>
        </div>
      </div>
    </div>

    <script>
      // 1. SMART ID RETRIEVAL
      let userId = null;
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const profileIndex = pathSegments.indexOf("profile_view");

      if (profileIndex !== -1 && pathSegments.length > profileIndex + 1) {
        userId = pathSegments[profileIndex + 1];
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        userId = urlParams.get("id");
      }

      console.log("Extracted User ID:", userId);

      const API_URL = `htt://192.168.1.3:8080/api/v1/patient/public/${userId}`;

      async function loadProfile() {
        try {
          const response = await fetch(API_URL, {
            method: "GET",
            headers: { "Content-Type": "application/json" },
          });

          if (!response.ok) throw new Error("Failed");

          const json = await response.json();
          const data = json.data || json;

          // Standard Fields
          document.getElementById("fullName").innerText =
            data.fullName || "Unknown";
          document.getElementById("designation").innerText =
            data.designation || "Member";

          // Avatar
          document.getElementById("avatar").src = data.profileUrl
            ? data.profileUrl
            : "https://via.placeholder.com/150/007bff/ffffff?text=User";

          // Package Logic
          if (data.currentPackage) {
            const badge = document.getElementById("packageBadge");
            badge.style.display = "block";
            badge.innerText =
              data.currentPackage.toUpperCase() === "FREE"
                ? "Personal QR"
                : data.currentPackage;
          }

          // Insurance Details Logic (Shows in the header box)
          const insBox = document.getElementById("insuranceBox");
          if (
            data.insurancePolicy ||
            data.insuranceProvider ||
            data.policyNumber
          ) {
            insBox.style.display = "block";
            document.getElementById("insuranceProviderLabel").innerText =
              data.insuranceProvider || "Insurance Policy";
            document.getElementById("insuranceDetailsText").innerText =
              data.insurancePolicy || data.policyNumber || "Active";
          }

          // Core Contact Info (Hide row if data is missing)
          const setField = (id, rowId, value) => {
            if (value && value.trim() !== "") {
              document.getElementById(id).innerText = value;
            } else {
              document.getElementById(rowId).style.display = "none";
            }
          };
          setField("email", "emailRow", data.email);
          setField("phone", "phoneRow", data.phoneNumber);
          setField("address", "addressRow", data.address);

          // SMART PARSER: Automatically generate grid cards for any NEW data fields sent by the API
          // These keys are already handled in the UI, so we filter them out.
          const excludedKeys = [
            "fullName",
            "designation",
            "email",
            "phoneNumber",
            "address",
            "profileUrl",
            "currentPackage",
            "insurancePolicy",
            "insuranceProvider",
            "policyNumber",
            "id",
            "createdAt",
            "updatedAt",
          ];

          const gridContainer = document.getElementById("extraGrid");
          gridContainer.innerHTML = "";

          Object.keys(data).forEach((key) => {
            if (
              !excludedKeys.includes(key) &&
              data[key] !== null &&
              data[key] !== ""
            ) {
              // Format camelCase key to "Title Case" (e.g. bloodGroup -> Blood Group)
              const formattedLabel = key
                .replace(/([A-Z])/g, " $1")
                .replace(/^./, (str) => str.toUpperCase());
              const value = data[key];

              // Only render strings or numbers (ignore nested objects/arrays)
              if (typeof value === "string" || typeof value === "number") {
                gridContainer.innerHTML += `
                        <div class="grid-card">
                          <div class="label">${formattedLabel}</div>
                          <div class="value">${value}</div>
                        </div>
                      `;
              }
            }
          });

          // Show UI
          document.getElementById("loading").style.display = "none";
          document.getElementById("profile").style.display = "block";
        } catch (error) {
          console.error(error);
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
          document.getElementById("errorMsg").innerText =
            "Could not load profile. Check connection.";
        }
      }

      if (userId) {
        loadProfile();
      } else {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("errorMsg").innerText = "Invalid Profile Link.";
      }
    </script>
  </body>
</html>
